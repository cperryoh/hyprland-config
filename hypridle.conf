general {
    before_sleep_cmd = /usr/bin/openrgb --profile off --noautoconnect
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'; /usr/bin/openrgb --profile wallust-theme; python ~/scripts/open_rgb_script.py >> ~/logs.txt
}

# 1. Lock the screen FIRST (prevents desktop render events from breaking DPMS)
listener {
    timeout = 300
    on-timeout = noctalia msg session lock
}

# 2. Turn off DPMS shortly after locking
listener {
    timeout = 305
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# 3. Suspend PC
listener {
    timeout = 600
    on-timeout = systemctl suspend
}
